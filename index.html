<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Slop</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0e8;
    --paper: #fdfaf4;
    --ink: #1a1612;
    --muted: #8a7f72;
    --accent: #c0622a;
    --rule: #d8cfc3;
    --step-bg: #f9f5ee;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem 1rem 4rem;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    width: 100%;
    max-width: 520px;
    padding: 2.5rem 2rem;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 6px; left: 6px; right: -6px; bottom: -6px;
    border: 1px solid var(--rule);
    z-index: -1;
  }

  .header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 1rem;
    margin-bottom: 1.75rem;
  }

  .header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.75rem;
    font-weight: 400;
    line-height: 1.2;
  }

  .header p {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.5rem;
    line-height: 1.6;
    letter-spacing: 0.02em;
  }

  .index-title {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .index-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  .entries { display: flex; flex-direction: column; }

  .entry {
    display: grid;
    grid-template-columns: 2.2rem 1fr auto;
    gap: 0.75rem;
    align-items: start;
    padding: 0.95rem 0;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
  }

  .entry:last-child { border-bottom: none; }

  .entry-num {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.05rem;
    color: var(--accent);
    font-style: italic;
    text-align: right;
    padding-top: 0.1rem;
  }

  .entry-name {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 0.2rem;
  }

  .entry-desc {
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.55;
  }

  .entry-arrow {
    color: var(--muted);
    font-size: 0.85rem;
    padding-top: 0.1rem;
    transition: transform 0.15s, color 0.15s;
  }

  .entry:hover .entry-name { color: var(--accent); }
  .entry:hover .entry-arrow { color: var(--accent); transform: translateX(3px); }
  .entry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .notes {
    margin-top: 1.75rem;
    padding: 1rem;
    border: 1px dashed var(--rule);
    font-size: 0.68rem;
    color: var(--muted);
    line-height: 1.75;
    letter-spacing: 0.02em;
  }

  @media (max-width: 430px) {
    .card { padding: 1.75rem 1.25rem; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Random Slop</h1>
    <p>Random stuff that I'm too lazy to build for myself but that I want to share with someone</p>
  </div>

  <div class="index-title">Pages</div>

  <div class="entries">
    <a class="entry" href="brew-calculator.html">
      <div class="entry-num">1</div>
      <div>
        <div class="entry-name">Brew Calculator</div>
        <div class="entry-desc">Pour-over &amp; cold brew recipes — V60, Hoffmann, Kasuya 4:6, iced. Scales pours to your dose.</div>
      </div>
      <div class="entry-arrow">&rarr;</div>
    </a>
  </div>
</div>
</body>
</html>
